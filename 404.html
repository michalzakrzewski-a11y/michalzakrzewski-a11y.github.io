      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'functionality_storage': 'granted',
        'personalization_storage': 'denied',
        'security_storage': 'granted',
        'wait_for_update': 500
      });
      
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);
      
      // Check for saved consent and apply immediately
      (function() {
        try {
          var savedConsent = localStorage.getItem('cookieConsent');
          if (savedConsent) {
            var consent = JSON.parse(savedConsent);
            gtag('consent', 'update', {
              'ad_storage': consent.marketing || consent.partners ? 'granted' : 'denied',
              'ad_user_data': consent.marketing || consent.partners ? 'granted' : 'denied',
              'ad_personalization': consent.marketing || consent.partners ? 'granted' : 'denied',
              'analytics_storage': consent.analytics ? 'granted' : 'denied',
              'personalization_storage': consent.functional ? 'granted' : 'denied'
            });

      })();
